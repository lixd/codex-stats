let params=new URLSearchParams(location.search),variant=variants[params.get('variant')]?params.get('variant'):'A',page=pages[params.get('page')]?params.get('page'):'overview';
const sampleModels=[{name:'gpt-6.1-sol',input:'165.06M',cache:'159.82M',uncached:'5.24M',output:'497.9K',reason:'137K',total:'165.56M',sessions:19,width:100},{name:'gpt-6-astra',input:'60.10M',cache:'58.64M',uncached:'1.46M',output:'221.6K',reason:'56K',total:'60.32M',sessions:9,width:36.4},{name:'Unknown model',input:'3.10M',cache:'3.05M',uncached:'50K',output:'67K',reason:'—',total:'3.17M',sessions:7,width:1.9}];
const samples=[['15:00:03','codex-stats','5.4K','367','109.2K','114.9K','≈9 s','≈40.6'],['14:59:54','codex-stats','6.2K','315','103.2K','109.7K','≈11.8 s','≈26.6'],['14:59:42','codex-stats','2.5K','284','101.1K','103.9K','≈10.7 s','≈26.6'],['14:59:31','codex-stats','1.2K','928','100.1K','102.2K','≈24.6 s','≈37.7'],['14:59:04','workbench','889','509','99.3K','100.7K','≈11.4 s','≈44.6'],['14:58:50','workbench','5.1K','378','94.3K','99.8K','≈9.8 s','≈38.7'],['14:58:35','local-tools','1.0K','322','93.4K','94.8K','≈8.2 s','≈39.0'],['14:58:24','local-tools','2.9K','784','90.8K','94.4K','≈23.5 s','≈33.4']];
function search(placeholder){return `<label class="search">${icon('search',13)}<input aria-label="${placeholder}" placeholder="${placeholder}" type="search" data-search></label>`}
function metric(label,value,sub,ico){return `<div class="metric"><div class="metric-label">${ico?icon(ico,13):''}${label}</div><div class="metric-value number">${value}</div><div class="metric-sub">${sub}</div></div>`}
function stats(){return metric('输入 Token','228.26M','包含缓存输入','input')+metric('输出 Token','786.5K','包含推理 Token','output')+metric('缓存输入','221.51M','已包含在输入中','cache')}
function chart(){let values=[.4,2.8,2.6,0,0,0,0,0,0,16,21,50.05,8,65,62,1.2,0,0,0,0,0,0,0,0];return `<div class="chart">${[75,50,25,0].map((v,i)=>`<div class="grid-line" style="top:calc(9px + (100% - 33px) * ${i}/3)"><span>${v?v+'M':'0'}</span></div>`).join('')}<div class="plot">${values.map(v=>`<i class="bar ${v>=62?'peak':''}" style="height:${v/75*100}%"></i>`).join('')}</div><div class="xaxis"><span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span></div></div>`}
function rankings(){return `<div class="ranking">${sampleModels.map(m=>`<div><div class="rank-top"><span class="rank-name">${m.name}</span><span class="number">${m.total}</span></div><div class="rank-track"><i style="width:${m.width}%"></i></div><div class="rank-sub"><span>输入 ${m.input} · 输出 ${m.output}</span><span>${m.sessions} 会话</span></div></div>`).join('')}</div>`}
function facts(){return `<dl class="facts"><dt>输入 Token</dt><dd>228.26M</dd><dt>缓存输入</dt><dd>221.51M</dd><dt>非缓存输入</dt><dd>6.75M</dd><dt>输出 Token</dt><dd>786.5K</dd><dt>推理 Token</dt><dd>未完整记录</dd></dl>`}
function lower(){return `<div class="lower"><section class="panel"><div class="section-head"><h3 class="section-title">模型排行</h3><span class="muted">按总 Token</span></div>${rankings()}</section><section class="panel"><div class="section-head"><h3 class="section-title">Token 明细</h3><span class="muted">今天</span></div>${facts()}</section></div>`}
function OverviewA(){return `<div class="metrics">${metric('总 Token','229.05M','输入 + 输出','grid')}${stats()}</div><section class="panel chart-panel"><div class="section-head"><h3 class="section-title">使用趋势</h3><span class="muted">今天 · 按本地小时</span></div>${chart()}<p class="chart-foot">按计入用量的日志事件时间归属</p></section>${lower()}`}
function OverviewB(){return `<section class="hero-paper"><div class="paper-total"><div class="metric-label">今天的总 Token</div><div class="metric-value number">229.05M</div><div class="metric-sub">输入 + 输出</div></div><div class="paper-stats">${stats()}</div></section><section class="panel chart-panel"><div class="section-head"><h3 class="section-title">使用趋势</h3><span class="muted">今天 · 按本地小时</span></div>${chart()}<p class="chart-foot">按计入用量的日志事件时间归属</p></section>${lower()}`}
function OverviewC(){return `<section class="iris-top"><div class="iris-activity"><div class="iris-total"><div><div class="metric-label">总 Token</div><div class="metric-value number">229.05M</div><p class="fineprint">输入 + 输出</p></div><span class="iris-tag">今天 · 按本地小时</span></div>${chart()}<p class="chart-foot">使用趋势 · 按计入用量的日志事件时间归属</p></div><div class="iris-aside">${stats()}</div></section>${lower()}`}
function Models(){return `<div class="page-heading"><div><h2>模型消耗明细</h2><p>按模型拆分输入、缓存、输出与推理</p></div>${search('搜索模型')}</div><div class="filters"><label>排序</label><select aria-label="示意排序" disabled><option>总 Token ↓</option></select></div><div class="data-surface"><table class="data-table"><thead><tr><th>模型</th><th>输入</th><th>缓存输入</th><th>非缓存输入</th><th>输出</th><th>推理</th><th>总 Token</th><th>会话</th></tr></thead><tbody>${sampleModels.map(m=>`<tr data-filter="${m.name.toLowerCase()}"><td class="strong">${m.name}</td><td>${m.input}</td><td>${m.cache}</td><td>${m.uncached}</td><td>${m.output}</td><td>${m.reason}</td><td class="strong">${m.total}</td><td>${m.sessions}</td></tr>`).join('')}</tbody></table><div class="model-intro">${icon('list',12)}缓存已含在输入中，推理已含在输出中。缺失字段保留未知。</div></div><div class="model-summary"><span>模型 <b>3</b></span><span>合计 <b class="number">229.05M tokens</b></span></div><p class="below-note">统计来自本地日志，不等于订阅消耗百分比。Unknown model 表示日志没有提供可核验的模型归属。</p>`}
function Requests(){return `<div class="page-heading"><div><h2>1,683 <span style="font-size:14px;font-weight:500;letter-spacing:0">条用量记录</span></h2><p>今天的已计入记录</p></div></div><div class="filters">${search('搜索项目、模型、会话或请求 ID')}<label>模型</label><select aria-label="示意模型筛选" disabled><option>全部模型</option></select><label>排序</label><select aria-label="示意记录排序" disabled><option>最近记录 ↓</option></select></div><div class="data-surface"><table class="data-table"><thead><tr><th>时间</th><th class="text">项目 / 会话</th><th class="text">模型</th><th>新增输入</th><th>输出</th><th>缓存输入</th><th>总 Token</th><th>耗时 ≈</th><th>速度 ≈</th></tr></thead><tbody>${samples.map((r,i)=>`<tr data-filter="${r[1]} gpt-6.1-sol demo-0001"><td>${r[0]}<div class="sub">10/15</div></td><td class="text">${r[1]}<div class="sub">demo-0001</div></td><td class="text">gpt-6.1-sol</td>${r.slice(2).map((v,j)=>`<td${j===3?' class="strong"':''}>${v}${j===5?'<div class="sub">tok/s</div>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="table-caption"><span>当前范围合计 <b class="number" style="color:var(--text);font-weight:550">229.05M tokens</b></span><span>新增输入 = 输入 − 缓存输入</span></div><p class="below-note">点击记录可查看详情。累计增量与初始快照可能包含多次请求，记录条数不等于已确认请求数。<br>≈ 为事件边界估算，包含首次等待；上方仅展示合成列表的前 8 条。</p>`}
function Sessions(){let items=[['codex-stats','43.71M','15:00','gpt-6.1-sol'],['workbench','35.45M','14:52','gpt-6.1-sol'],['local-tools','22.89M','14:38','gpt-6-astra'],['notes','16.24M','13:59','gpt-6.1-sol']];return `<div class="session-layout"><section class="session-list"><div class="page-heading"><div><h2>历史会话</h2><p>29 个本地会话</p></div></div>${search('搜索项目、模型或 Session ID')}<div class="session-sort">排序 <button class="control" disabled>最近活动 ${icon('chevron',11)}</button></div>${items.map((r,i)=>`<div class="session-item ${i===0?'active':''}" data-filter="${r[0]} ${r[3]}"><div class="session-name">${icon('folder',13)}${r[0]}</div><div class="session-meta">10 月 15 日 ${r[2]} · demo-000${i+1}</div><div class="session-total number">${r[1]}<span>${r[3]}</span></div></div>`).join('')}</section><section class="session-detail"><div class="detail-heading"><div><h2>codex-stats</h2><p>会话 demo-0001</p><p class="path">~/Projects/codex-stats</p></div><button class="control" disabled>${icon('copy',12)}复制 ID</button></div><section class="panel session-token"><div class="section-head" style="margin-bottom:0"><h3 class="section-title">会话 Token · 今天</h3><span class="muted">Codex Desktop</span></div><div class="large-value number">43.71M</div><dl class="facts"><dt>输入 Token</dt><dd>43.52M</dd><dt>缓存输入</dt><dd>42.28M</dd><dt>非缓存输入</dt><dd>1.24M</dd><dt>输出 Token</dt><dd>191.2K</dd><dt>推理 Token</dt><dd>57.5K</dd></dl><div class="session-times"><span>开始 10/13 17:43</span><span>最后活动 10/15 15:00</span></div></section><section class="session-models"><h3 class="section-title">会话内模型明细</h3><div class="session-model-row"><div>gpt-6.1-sol<div class="muted">输入 42.40M · 输出 170K</div></div><b class="number">42.57M</b></div><div class="session-model-row"><div>Unknown model<div class="muted">日志未记录模型</div></div><span class="number">1.14M</span></div></section></section></div>`}
function shell(){const pageIcons={overview:'grid',requests:'list',models:'cpu',sessions:'folder'};let content=page==='overview'?({A:OverviewA,B:OverviewB,C:OverviewC,D:OverviewA}[variant])():page==='models'?Models():page==='requests'?Requests():Sessions();return `<div class="window variant-${variant}"><div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><span class="window-title">Codex Stats</span></div><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">${icon('wave',17)}</span>Codex Stats</div><div class="nav-caption">本地分析</div><nav class="nav" aria-label="页面导航">${Object.entries(pages).map(([k,v])=>`<button data-page="${k}" class="${k===page?'active':''}" ${k===page?'aria-current="page"':''}>${icon(pageIcons[k],15)}${k==='overview'?'总览':v}</button>`).join('')}</nav><div class="side-bottom"><div class="side-note">${icon('lock',11)}完全离线 · 只读</div><button class="side-settings" disabled>${icon('settings',14)}设置</button><button class="quit" disabled>退出应用</button></div></aside><main class="main"><header class="header"><div class="header-top"><h2 class="header-title">${icon(pageIcons[page],19)}${pages[page]}</h2><div class="refresh"><span>刷新于 15:01:09</span><button class="control" disabled>${icon('refresh',12)}立即刷新</button><select aria-label="示意自动刷新" disabled><option>自动刷新 30 秒</option></select></div></div><div class="header-bottom"><div class="source">${icon('list',12)}Codex · 本地会话日志</div><div class="periods" aria-label="时间范围示意"><span class="selected">今天</span><span>7 天</span><span>30 天</span><span>全部</span></div></div></header><div class="notice">${icon('warning',12)}<span>9 条警告 / 错误 · 统计可能不完整</span><span class="detail">查看详情 ›</span></div><div class="content page-${page} ${page==='sessions'?'session-main':''}">${content}</div></main></div></div>`}
function render(){document.getElementById('variant-title').textContent=variants[variant].title;document.getElementById('variant-description').textContent=variants[variant].description;document.getElementById('app').innerHTML=shell();document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('current',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});document.title=`${variants[variant].title} · ${pages[page]} · Codex Stats 视觉原型`;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setView(variant,b.dataset.page)));document.querySelectorAll('[data-search]').forEach(input=>input.addEventListener('input',()=>{let q=input.value.trim().toLowerCase();document.querySelectorAll('[data-filter]').forEach(row=>row.hidden=!row.dataset.filter.includes(q))}));}
function setView(v,p=page){variant=v;page=p;let u=new URL(location.href);u.searchParams.set('variant',variant);u.searchParams.set('page',page);history.replaceState(null,'',u);render()}
function cycle(n){let keys=Object.keys(variants);setView(keys[(keys.indexOf(variant)+n+keys.length)%keys.length])}
document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.variant)));document.getElementById('prev').addEventListener('click',()=>cycle(-1));document.getElementById('next').addEventListener('click',()=>cycle(1));document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});window.addEventListener('popstate',()=>{let p=new URLSearchParams(location.search);variant=variants[p.get('variant')]?p.get('variant'):'A';page=pages[p.get('page')]?p.get('page'):'overview';render()});render();
</script>
