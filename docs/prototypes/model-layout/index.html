<!doctype html>
<!-- Three structural variants of the existing Models page in a throwaway HTML app shell.
     ?variant=A|B|C. Synthetic data only; no product runtime code, storage or external assets. -->
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Stats · 模型布局预览</title>
<style>
*{box-sizing:border-box} :root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#29383c;background:#e9f0f1;font-synthesis:none;color-scheme:light;--accent:#23747f;--muted:#68797e;--line:#dfebed;--soft:#edf7f8;--page:#f3fafa}
body{margin:0;padding:22px 24px 96px}h1,h2,h3,p,dl,dd{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default}button,input,select{border:1px solid var(--line);border-radius:6px;background:#fff}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #23747f;outline-offset:3px}a{color:var(--accent)}
.intro{max-width:1120px;margin:0 auto 16px;display:flex;align-items:end;justify-content:space-between;gap:16px}.intro h1{font-size:20px;font-weight:650}.intro p{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}.preview-label{font-size:11px;white-space:nowrap;color:var(--muted)}
.window{width:1120px;max-width:100%;height:760px;margin:auto;background:var(--page);border:1px solid #cddcde;border-radius:11px;overflow:hidden;box-shadow:0 12px 35px #233b4210}.titlebar{height:34px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);position:relative}.traffic{position:absolute;left:13px;display:flex;gap:7px}.traffic i{width:11px;height:11px;background:#ff6057;border-radius:50%}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.shell{display:flex;height:calc(100% - 34px)}.sidebar{width:184px;flex-shrink:0;background:#eaf5f5;border-right:1px solid var(--line);padding:28px 13px 18px;display:flex;flex-direction:column}.brand{font-size:14px;font-weight:650;padding:0 10px 32px}.nav{display:grid;gap:6px}.nav div{font-size:12px;color:var(--muted);padding:11px 12px;border-radius:7px}.nav .active{background:#dff0f2;color:var(--accent);font-weight:600}.side-bottom{margin-top:auto;font-size:10px;color:var(--muted);padding:10px;line-height:1.8}.main{flex:1;min-width:0;display:flex;flex-direction:column}.header{background:#fcfefe;padding:17px 24px 14px;border-bottom:1px solid var(--line);display:grid;gap:14px;flex-shrink:0}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.header h2{font-size:17px;font-weight:650;display:flex;align-items:center;gap:9px}.cpu{width:18px;height:18px;border:1.5px solid currentColor;border-radius:3px;display:grid;place-items:center}.cpu:after{content:'';width:8px;height:8px;border:1px solid currentColor}.refresh{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}.refresh button,.refresh select{padding:5px 8px;background:#eef1f1;color:#394346;border-color:transparent}.source{font-size:11px;color:var(--muted)}.period{display:flex;background:#ecefef;border-radius:6px;padding:2px;gap:1px}.period span{font-size:11px;padding:4px 14px;border-radius:5px}.period .selected{background:#087dff;color:#fff}.notice{display:flex;align-items:center;gap:8px;padding:8px 24px;border-bottom:1px solid var(--line);background:#f4f5ef;font-size:11px;flex-shrink:0}.notice .warning{color:#975813}.notice .details{margin-left:auto;color:var(--muted)}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column}.toolbar{padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}.toolbar h3{font-size:15px;font-weight:600}.toolbar h3 span{color:var(--muted);font-weight:400;font-size:11px;margin-left:8px}.tools{display:flex;gap:8px}.tools input{width:170px;padding:6px 9px;font-size:11px;min-width:0}.tools select{font-size:11px;padding:5px 7px;width:126px}.content{padding:0 24px 20px;overflow-y:auto;min-height:0;flex:1}.footnote{font-size:10px;line-height:1.7;color:var(--muted);margin:13px 0 3px}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums;letter-spacing:-.25px}.model-name{font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.4}.sessions{font-size:10px;color:var(--muted);margin-top:5px}.total{text-align:right;white-space:nowrap}.total .value{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.7px}.total .unit{font-size:10px;color:var(--muted);margin-left:5px}.total .label{font-size:10px;color:var(--muted);margin-bottom:4px}.groups{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}.group{min-width:0}.group-title{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;gap:8px}.group-title strong{font-size:14px;font-weight:550;white-space:nowrap}.sub-values{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:10px;margin-top:10px;line-height:1.5;color:var(--muted)}.sub-values b{font-weight:400;color:#41555b;margin-left:5px;white-space:nowrap}.group+.group{border-left:1px solid var(--line);padding-left:28px}.unknown{font-size:10px;color:var(--muted);font-weight:400;margin-left:8px}.empty{background:#fff;border:1px solid var(--line);border-radius:10px;text-align:center;padding:50px 20px;font-size:13px}.empty p{color:var(--muted);font-size:11px;margin-top:10px}
/* A: roomier horizontal records; all details visible, no disclosure interaction. */
.model-list{display:grid;gap:12px}.model-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}.row-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:17px}.model-row .total .label{display:inline;margin-right:8px}.model-row .total .value{font-size:21px}.model-row .groups{padding-top:15px;border-top:1px solid #edf2f3}.model-row .group-title{font-size:11px}.model-row .sessions{margin-top:4px}
/* B: a two-column catalogue of independent model cards. */
.model-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.model-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:20px}.model-card .card-total{margin:20px 0 18px;display:flex;justify-content:space-between;align-items:end}.model-card .card-total .total{text-align:left}.model-card .total .value{font-size:29px}.model-card .total .label{margin-bottom:7px}.mini-note{font-size:10px;color:var(--accent);background:var(--soft);border-radius:5px;padding:5px 7px}.model-card .groups{display:block;border-top:1px solid var(--line);padding-top:14px}.model-card .group+.group{border-left:0;padding-left:0;border-top:1px solid #edf2f3;padding-top:13px;margin-top:13px}.model-card .sub-values{margin-top:7px;justify-content:space-between;gap:6px}
/* C: selector and one detailed model; more reading space, selection required. */
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}.model-selector{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;display:grid;gap:3px}.model-choice{padding:13px 12px;text-align:left;border-color:transparent;background:none;min-width:0}.model-choice.active{background:#dff0f2}.model-choice .model-name{font-size:12px}.choice-meta{font-size:11px;margin-top:7px;display:flex;justify-content:space-between;color:var(--muted);gap:10px}.choice-meta b{font-weight:550;color:#41555b}.detail-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:24px;min-width:0}.detail-card .model-name{font-size:17px}.detail-card .total{text-align:left;margin:28px 0}.detail-card .total .value{font-size:36px}.detail-card .groups{display:block}.detail-card .group{padding:17px 0;border-top:1px solid var(--line)}.detail-card .group+.group{border-left:0;padding-left:0}.detail-card .group-title strong{font-size:20px}.detail-card .sub-values{display:grid;gap:12px;margin-top:15px}.detail-card .sub-values span{display:flex;justify-content:space-between;gap:8px;font-size:11px}.detail-card .sub-values b{font-size:12px}.detail-card .footnote{border-top:1px solid var(--line);padding-top:13px}
.switcher{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);background:#233c42;color:#fff;padding:7px 9px;border-radius:12px;display:flex;align-items:center;gap:7px;box-shadow:0 6px 22px #17343f25;white-space:nowrap}.switcher button{border:0;background:none;color:#bed0d3;padding:8px 12px;font-size:12px;border-radius:7px}.switcher button.current{background:#ffffff1f;color:#fff}.switcher .arrow{color:#fff;padding:7px 9px}.switcher small{font-size:10px;color:#a8bec3;margin:0 7px}.variant-summary{font-size:11px;color:var(--muted);max-width:1120px;margin:12px auto 0;line-height:1.6}
@media(max-width:1050px){body{padding:18px 14px 94px}.toolbar,.header{padding-left:20px;padding-right:20px}.content{padding-left:20px;padding-right:20px}.tools input{width:145px}.model-row{padding:17px}.groups{gap:18px}.group+.group{padding-left:18px}.split{grid-template-columns:210px minmax(0,1fr);gap:14px}.detail-card{padding:20px}.refresh .stamp{display:none}.model-grid{gap:12px}.model-card{padding:17px}}
@media(max-width:800px){.sidebar{width:145px}.toolbar{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools input{flex:1}.model-grid{grid-template-columns:1fr}.groups{grid-template-columns:1fr}.group+.group{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}.split{grid-template-columns:1fr}.model-selector{grid-template-columns:repeat(2,minmax(0,1fr))}.source{display:none}.header-bottom{justify-content:flex-end}.refresh select{display:none}.intro{align-items:start;flex-direction:column}.switcher small{display:none}}
</style>
<div class="intro"><div><h1 id="preview-title"></h1><p id="preview-description"></p></div><span class="preview-label">设计预览 · 合成数据 · 非运行中的 App</span></div>
<div class="window"><div class="titlebar"><span class="traffic"><i></i><i></i><i></i></span>Codex Stats</div><div class="shell"><aside class="sidebar"><div class="brand">Codex Stats</div><nav class="nav"><div>总览</div><div>请求日志</div><div class="active">模型统计</div><div>历史会话</div><div>设置</div></nav><div class="side-bottom">完全离线 · 只读<br>本地会话日志</div></aside><main class="main"><header class="header"><div class="header-row"><h2><span class="cpu" aria-hidden="true"></span>模型统计</h2><div class="refresh"><span class="stamp">刷新于 17:27:14</span><button disabled>⟳ 立即刷新</button><select disabled aria-label="自动刷新示意"><option>自动刷新 30 秒</option></select></div></div><div class="header-row header-bottom"><span class="source">Codex · 本地会话日志</span><div class="period" aria-label="时间范围示意"><span>今天</span><span class="selected">7 天</span><span>30 天</span><span>全部</span></div></div></header><div class="notice"><span class="warning">⚠</span>9 条警告 / 错误 · 统计可能不完整<span class="details">查看详情（示意）</span></div><section class="workspace"><div class="toolbar"><h3>模型用量<span id="count"></span></h3><div class="tools"><input id="search" type="search" placeholder="搜索模型" aria-label="搜索模型"><select id="sort" aria-label="模型排序"><option value="total">总 Token ↓</option><option value="input">输入 ↓</option><option value="output">输出 ↓</option><option value="cache">缓存输入 ↓</option><option value="reasoning">推理 ↓</option><option value="name">模型名称</option></select></div></div><div id="content" class="content"></div></section></main></div></div>
<p class="variant-summary" id="summary"></p>
<nav class="switcher" aria-label="设计方案切换"><button class="arrow" id="prev" aria-label="上一个方案">←</button><button data-variant="A">A 分组列表</button><button data-variant="B">B 双列卡片</button><button data-variant="C">C 列表与详情</button><button class="arrow" id="next" aria-label="下一个方案">→</button><small>← → 切换</small></nav>
<script>
const variants={A:{title:'A · 分组列表',description:'推荐：每个模型独立成组，总量突出，输入与输出各有一块明细。',summary:'完整明细直接可见，方便上下对照。用纵向空间换取清晰层级；模型较多时自然向下滚动。'},B:{title:'B · 双列卡片',description:'每个模型是一张独立卡片，优先看到名称和总用量，再看组成。',summary:'更轻松、卡片感更强。适合少量模型；跨模型逐项比较需要左右扫视，窄窗改为单列。'},C:{title:'C · 列表与详情',description:'左侧快速选模型，右侧专注读一份完整明细。',summary:'同时容纳更多模型，单个模型的阅读最从容；比较多个模型需要切换。此结构会增加模型选择状态，暂不推荐作为默认。'}};
// Exact synthetic integers; no values are read from local logs or copied as verified usage.
const models=[{name:'gpt-6.1-sol',input:1004650000,cache:978130000,output:3790000,reasoning:1290000,sessions:63},{name:'gpt-6-luna',input:331100000,cache:324600000,output:1830000,reasoning:1260000,sessions:1},{name:'gpt-6-astra',input:86650000,cache:84230000,output:314600,reasoning:83400,sessions:14},{name:'Unknown model',input:21450000,cache:null,output:501600,reasoning:null,sessions:17},{name:'codex-auto-review',input:921200,cache:686600,output:3226,reasoning:1390,sessions:5}].map(m=>({...m,total:m.input+m.output}));
let variant=Object.hasOwn(variants,new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A',selected=models[0].name;
const fmt=n=>n===null?'未完整记录':n>=1e6?new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n/1e6)+'M':n>=1e3?new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(n/1e3)+'K':String(n);
const num=n=>`<span class="num" title="${n===null?'未完整记录':n.toLocaleString('en-US')+' tokens'}">${fmt(n)}</span>`;
const note='缓存输入已包含在输入中；推理已包含在输出中。未知字段保留“未完整记录”。';
function identity(m){return `<div><div class="model-name">${m.name}</div><div class="sessions">${m.sessions} 个会话${m.name==='Unknown model'?' · 日志未记录模型归属':''}</div></div>`}
function total(m){return `<div class="total"><div class="label">总 Token</div><span class="value">${num(m.total)}</span></div>`}
function groups(m){return `<div class="groups"><section class="group"><div class="group-title"><span>输入 Token</span><strong>${num(m.input)}</strong></div><div class="sub-values"><span>其中缓存<b>${num(m.cache)}</b></span><span>非缓存<b>${num(m.cache===null?null:m.input-m.cache)}</b></span></div></section><section class="group"><div class="group-title"><span>输出 Token</span><strong>${num(m.output)}</strong></div><div class="sub-values"><span>其中推理<b>${num(m.reasoning)}</b></span></div></section></div>`}
function VariantA(rows){return `<div class="model-list">${rows.map(m=>`<article class="model-row"><header class="row-heading">${identity(m)}${total(m)}</header>${groups(m)}</article>`).join('')}</div><p class="footnote">${note}<br>总 Token = 输入 + 输出；来自本地日志，不代表订阅消耗百分比。</p>`}
function VariantB(rows){return `<div class="model-grid">${rows.map(m=>`<article class="model-card">${identity(m)}<div class="card-total">${total(m)}<span class="mini-note">输入 + 输出</span></div>${groups(m)}</article>`).join('')}</div><p class="footnote">${note}</p>`}
function VariantC(rows){if(!rows.some(m=>m.name===selected))selected=rows[0].name;const m=rows.find(m=>m.name===selected);return `<div class="split"><nav class="model-selector" aria-label="选择模型">${rows.map(m=>`<button class="model-choice ${m.name===selected?'active':''}" data-model="${m.name}" aria-pressed="${m.name===selected}"><div class="model-name">${m.name}</div><div class="choice-meta"><b>${num(m.total)}</b><span>${m.sessions} 会话</span></div></button>`).join('')}</nav><article class="detail-card">${identity(m)}${total(m)}${groups(m)}<p class="footnote">总 Token = 输入 + 输出<br>${note}</p></article></div>`}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),sort=document.getElementById('sort').value,rows=models.filter(m=>m.name.toLowerCase().includes(q)).sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):((b[sort]??-1)-(a[sort]??-1)||a.name.localeCompare(b.name)));document.getElementById('preview-title').textContent=variants[variant].title;document.getElementById('preview-description').textContent=variants[variant].description;document.getElementById('summary').textContent=variants[variant].summary;document.getElementById('count').textContent=rows.length+' 个模型 · 7 天';document.getElementById('content').innerHTML=rows.length?({A:VariantA,B:VariantB,C:VariantC}[variant])(rows):'<div class="empty">没有匹配的模型<p>试试其他模型名称，或清空搜索。</p></div>';document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('current',b.dataset.variant===variant);b.setAttribute('aria-pressed',String(b.dataset.variant===variant))});document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{selected=b.dataset.model;render()});document.title=variants[variant].title+' · Codex Stats 布局预览'}
function setVariant(v){variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);render();document.getElementById('content').scrollTop=0}
function cycle(step){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+step+keys.length)%keys.length])}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>setVariant(b.dataset.variant));document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></html>
